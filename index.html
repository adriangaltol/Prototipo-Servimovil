<title>Servimovil · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: la tienda online de Hostelería Servimovil tal como está en el Figma "MAIN": práctica, de catálogo industrial.
IDEA: prototipo funcional que reproduce las 13 pantallas del Figma y se comporta según la ERS.
PICTURE: fotos de producto dibujadas en acero inoxidable sobre fondo claro, una por tipo de máquina.
COLOUR and TYPE: pizarra #263238 + verde lima #7cc410 + blanco, como el Figma; Open Sans.
LAYOUT: web pública con cabecera/menú/pie y panel de empleado con barra lateral oscura.
*/
:root{color-scheme:light;--dark:#263238;--dark2:#1d272c;--lime:#7cc410;--lime-d:#5f9a08;--lime-bg:#f1f8e4;--ink:#1d2327;--mut:#5d6b73;--line:#e3e8eb;--bg:#f5f7f8;--card:#fff;--red:#d93025;--amber:#b86e00;--amber-bg:#fff3dc;--blue:#1f6fb8;--blue-bg:#e6f0fb}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{font:15px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff;overflow-x:clip}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid #cfd8dc;border-radius:6px;padding:9px 11px;background:#fff;font-size:15px;width:100%;min-height:40px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--lime-d);margin:0}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--dark);background:#fff;color:var(--dark);border-radius:6px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f2f5f6}
.btn.p{background:var(--lime);border-color:var(--lime);color:#14200a}
.btn.p:hover{background:#6db30a}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.d:hover{background:#34454d}
.btn.g{border-color:transparent;background:transparent;color:var(--lime-d);padding-inline:6px}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;display:inline-grid;place-items:center;color:var(--dark)}
.ib:hover{background:#eef2f3}.ib.r{color:var(--red)}
.ib svg,.btn svg{width:17px;height:17px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#eef1f2;color:#3d4b52;white-space:nowrap}
.tag.g{background:#e3f3c8;color:#3d6b00}.tag.b{background:var(--blue-bg);color:var(--blue)}.tag.a{background:var(--amber-bg);color:var(--amber)}.tag.r{background:#fde4e1;color:var(--red)}.tag.l{background:var(--lime);color:#14200a}
.muted{color:var(--mut)}.small{font-size:13px}.ok{color:#3d7a00;font-weight:600}.bad{color:var(--red);font-weight:700}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.2vw,34px);font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:16px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-weight:700;text-align:left;padding:10px 12px;background:#f6f8f9;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child>b{white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--lime-bg);border:1px solid #d6ebb0;font-size:14px}
.notice.a{background:var(--amber-bg);border-color:#f3d9a6}
.notice.r{background:#fdecea;border-color:#f6c6c0}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
/* --- cabecera pública --- */
.top{background:var(--dark);color:#dfe6e9;font-size:12.5px}
.top .wrap{display:flex;gap:20px;align-items:center;min-height:34px;flex-wrap:wrap}
.top a{text-decoration:none;cursor:pointer}
.top .acc{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:600}
.top .acc svg{width:14px;height:14px;color:var(--lime)}
.head .wrap{display:flex;gap:24px;align-items:center;padding-block:14px}
.logo{display:flex;gap:9px;align-items:center;text-decoration:none;cursor:pointer;flex:none}
.logo small{display:block;font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--mut)}
.logo b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1}
.logo svg{width:38px;height:34px}
.ph{width:100%;height:100%;object-fit:cover;display:block}
.logoimg{display:block;height:46px;width:auto}
footer .logoimg,.eside .logoimg{background:#fff;border-radius:8px;padding:6px 10px;height:44px;box-sizing:content-box}
.eside .logoimg{height:34px}
.search{flex:1;display:flex;max-width:460px;margin-inline:auto}
.search input{border-radius:6px 0 0 6px;border-right:0}
.search button{border:0;background:var(--lime);border-radius:0 6px 6px 0;width:46px;cursor:pointer;display:grid;place-items:center}
.search svg{width:18px;height:18px}
.cartb{display:flex;gap:8px;align-items:center;cursor:pointer;border:0;background:none;text-align:left;position:relative}
.cartb svg{width:26px;height:26px}
.cartb small{display:block;font-size:11px;color:var(--mut)}
.cartb b{font-size:14px}
.cartb i{position:absolute;left:16px;top:-4px;background:var(--lime);color:#14200a;font-style:normal;font-size:10.5px;font-weight:800;border-radius:99px;padding:0 5px}
.nav{border-bottom:3px solid var(--lime)}
.nav .wrap{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:11px 12px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;border-radius:6px 6px 0 0}
.nav a:hover,.nav a.on{color:var(--lime-d)}
.crumb{font-size:12.5px;color:var(--mut);padding:16px 0 4px}
.crumb a{cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
main.pub{min-height:60vh;padding-bottom:56px}
footer{background:var(--dark2);color:#c4cfd4;font-size:13px;padding:40px 0 22px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr .8fr 1fr;gap:28px}
footer h4{color:#fff;margin:0 0 10px;font-size:14px}
footer a{display:block;text-decoration:none;cursor:pointer;margin:4px 0}
footer a:hover{color:#fff}
footer .logo b{color:#fff}footer .logo small{color:#9fb0b7}
footer .copy{grid-column:1/-1;border-top:1px solid #33434b;padding-top:16px;font-size:12px}
/* --- inicio --- */
.hero{background:var(--dark);color:#fff}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:48px}
.hero h1{font-size:clamp(30px,4vw,44px);margin:14px 0 14px}
.hero p{color:#cfd8dc;max-width:480px;margin:0 0 22px}
.hero .pic{background:#f3f6f7;border-radius:14px;aspect-ratio:4/3;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px}
.hero .pic>div{background:#fff;border-radius:10px;display:grid;place-items:center}
.hero .pic svg{width:86%;height:86%}
.bens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}
.ben{display:flex;gap:12px;padding:16px}
.ben .ic{width:34px;height:34px;border-radius:99px;background:var(--lime-bg);display:grid;place-items:center;flex:none;color:var(--lime-d)}
.ben .ic svg{width:18px;height:18px}
.ben p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.sec{margin-top:40px}
.sec>p{margin:4px 0 16px;color:var(--mut);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{cursor:pointer;text-align:center;font-size:13px;font-weight:700;border:0;background:none;padding:0}
.cat .im{background:#f3f6f7;border-radius:10px;aspect-ratio:1.25;display:grid;place-items:center;margin-bottom:8px;transition:background .15s}
.cat:hover .im{background:#e8f3d6}
.cat svg{width:72%;height:80%}
.prods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pc{display:flex;flex-direction:column;overflow:hidden}
.pc .im{background:#f3f6f7;aspect-ratio:1.25;display:grid;place-items:center;cursor:pointer}
.pc .im svg{width:70%;height:82%}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc .br{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.pc .nm{font-weight:700;font-size:14px;cursor:pointer;line-height:1.3}
.pc .nm:hover{color:var(--lime-d)}
.price{font-weight:800;font-size:19px;white-space:nowrap}
.price s{font-weight:400;color:var(--mut);font-size:13px;margin-left:4px}
.price small{font-weight:400;color:var(--mut);font-size:12px;margin-left:3px}
.stk{font-size:12px;font-weight:600;color:#3d7a00}.stk.no{color:var(--red)}
.pc .btn{margin-top:auto}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.duo .card{padding:24px}
.duo .dk{background:var(--dark);color:#fff;border:0}
.duo .lt{background:var(--lime-bg);border-color:#d6ebb0}
.duo p{font-size:14px;margin:8px 0 16px}
.duo .dk p{color:#cfd8dc}
.brands{display:flex;flex-wrap:wrap;gap:8px}
.brands span{border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--mut)}
/* catálogo */
.catl{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;margin-top:10px}
.filters{padding:16px;align-self:start}
.filters h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.filters label.c{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{background:#e3f3c8;color:#3d6b00;border:0;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
.prods.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* ficha */
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:10px}
.gal .main{background:#f3f6f7;border-radius:12px;aspect-ratio:1.1;display:grid;place-items:center}
.gal .main svg{width:70%;height:80%}
.gal .th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.gal .th div{background:#f3f6f7;border-radius:8px;aspect-ratio:1.3;display:grid;place-items:center;cursor:pointer;border:2px solid transparent}
.gal .th div.on{border-color:var(--lime)}
.gal .th svg{width:62%;height:70%}
.feat{margin:6px 0 0;padding-left:0;list-style:none;font-size:14px}
.feat li{padding:3px 0 3px 16px;position:relative}
.feat li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:2px;background:var(--lime)}
.qty{display:inline-flex;align-items:center;border:1px solid #cfd8dc;border-radius:6px}
.qty button{border:0;background:none;width:30px;height:32px;cursor:pointer;font-size:16px}
.qty span{min-width:28px;text-align:center;font-weight:700}
.kv td:first-child{font-weight:700;width:38%}
/* cuenta */
.acct{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;margin-top:14px}
.side{padding:14px;align-self:start}
.side .who{padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;text-decoration:none;cursor:pointer;font-size:14px}
.side a svg{width:17px;height:17px}
.side a:hover{background:#f3f6f7}.side a.on{background:var(--lime-bg);font-weight:700}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.tot.b{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* login */
.loginw{max-width:900px;margin:36px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.demo button{display:flex;width:100%;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer;text-align:left;font-size:14px}
.demo button:hover{border-color:var(--lime);background:var(--lime-bg)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--lime)}
/* empleado */
.emp{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.eside{background:var(--dark);color:#cfd8dc;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.eside .logo{color:#fff;padding:0 8px 18px}.eside .logo small{color:#9fb0b7}
.eside .g{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8fa1a9;font-weight:700;margin:16px 10px 6px}
.eside a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;text-decoration:none;cursor:pointer;font-size:14px;font-weight:600}
.eside a svg{width:17px;height:17px}
.eside a:hover{background:#33444c;color:#fff}
.eside a.on{background:var(--lime);color:#14200a}
.eside .out{margin-top:auto}
.ehead{display:flex;align-items:center;gap:14px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.ehead h1{font-size:19px}
.av{width:34px;height:34px;border-radius:99px;background:var(--lime);color:#14200a;font-weight:800;font-size:13px;display:grid;place-items:center}
.ebody{padding:22px 26px 48px;display:grid;gap:18px;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px}
.kpi b{display:block;font-size:30px;font-weight:800;margin-top:6px}
.kpi span{font-size:13px;color:var(--mut)}
.kpi .t{font-size:13px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.list .it{padding:12px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff}
.list .it.on{border:2px solid var(--lime-d);padding:11px 13px}
.prog{height:8px;border-radius:99px;background:#e4eaec;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lime);width:0;transition:width .25s}
/* modal y aviso */
.ov{position:fixed;inset:0;background:rgba(20,30,35,.45);display:grid;place-items:center;padding:16px;z-index:50}
.mod{background:#fff;border-radius:12px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:22px}
.mod h2{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.proto{background:#fffbe8;border-bottom:1px solid #f0e2a8;font-size:12.5px;color:#6b5a12}
.proto .wrap{display:flex;gap:12px;align-items:center;min-height:32px;flex-wrap:wrap}
.proto button{border:0;background:none;text-decoration:underline;cursor:pointer;color:inherit;font-size:12.5px;padding:0}
.err{color:var(--red);font-size:13px;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:1000px){.prods{grid-template-columns:repeat(2,minmax(0,1fr))}.prods.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.cats{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}footer .wrap{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.hero .wrap,.ficha,.catl,.acct,.loginw,.duo,.bens{grid-template-columns:1fr}.emp{grid-template-columns:1fr}.eside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}.eside .g,.eside .logo{display:none}.eside .out{margin:0}.search{order:3;max-width:none;flex-basis:100%}.head .wrap{flex-wrap:wrap}.f2,.f3{grid-template-columns:1fr}.ebody{padding:16px}.ehead{padding:12px 16px}}
@media(max-width:480px){.prods,.prods.c3{grid-template-columns:1fr}.cats{grid-template-columns:repeat(2,minmax(0,1fr))}footer .wrap{grid-template-columns:1fr}table{font-size:13px}}
</style>
</head>

<div id="layer"></div>
<script>
{

user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',

mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',

let gid=0;
function art(kind){
  // Si existe img/<tipo>.jpg (foto real) se usa; si no, cae a la ilustración
  return `<img class="ph" src="img/${kind}.jpg" alt="${kind}" loading="lazy" onerror="phFallback(this,'${kind}')">`;

// ---------- Reglas de precios (REGN-003, REGN-004, REGN-005) ----------
const dtoProv=p=>{const d=S.descProv.find(x=>x.proveedor===p.proveedor&&p.pagina>=x.desde&&p.pagina<=x.hasta);return d?d.pct:0};
const coste=p=>r2(p.precioCatalogo*(1-dtoProv(p)/100));
const factorDe=c=>{const f=S.factores.find(x=>c>=x.desde&&c<x.hasta);return f?f.factor:1};
const venta=p=>{const c=coste(p);return r2(c*factorDe(c))};
const beneficio=p=>r2(venta(p)-coste(p));
const estadoOferta=o=>{const t=iso(today0());return t<o.inicio?'programada':t>o.fin?'finalizada':'vigente'};
const ofertaDe=(p,fecha=iso(today0()))=>S.ofertas.find(o=>o.productos.includes(p.codigo)&&fecha>=o.inicio&&fecha<=o.fin);
const precioFinal=p=>{const o=ofertaDe(p);return o?r2(venta(p)*(1-o.pct/100)):venta(p)};
const prod=c=>S.productos.find(p=>p.codigo===c);
const user=id=>S.usuarios.find(u=>u.id===id)||{nombre:'—'};

function cotizar(lineas){
  let peso=0,vol=0;
  for(const l of lineas){const p=prod(l.codigo);if(p){peso+=p.peso*l.cant;vol+=p.volumen*l.cant}}
  const t=S.tarifas.filter(t=>t.pesoMax>=peso&&t.volMax>=vol).sort((a,b)=>a.precio-b.precio)[0];
  return {peso:r2(peso),vol:Math.round(vol*1000)/1000,tarifa:t||null,precio:t?t.precio:0};
}

// ---------- Presupuestos y facturas (REGN-007, REGN-008, REGN-009, REGN-010) ----------
const totalPres=p=>r2(p.lineas.reduce((s,l)=>s+l.cant*l.precio,0)+(p.transporte||0)+(p.manoObra||0));
const facturaDe=num=>S.facturas.find(f=>f.pres===num);
const presDe=num=>S.presupuestos.find(p=>p.num===num);
const nextNum=(k,pre)=>`${pre}-2026-${String(S.seq[k]++).padStart(4,'0')}`;

function resolverPres(num,acepta){
  const p=presDe(num);
  if(!p||p.estado!=='pendiente')return null; // REGN-008
  p.estado=acepta?'aceptado':'rechazado';
  let f=null;
  if(acepta&&!facturaDe(num)){ // REGN-009: como máximo una factura
    f={num:nextNum('fac','F'),pres:num,cliente:p.cliente,fecha:iso(today0()),metodo:null,fechaPago:null};
    S.facturas.unshift(f);
  }
  save();return f;
}
function pagarFactura(numF,metodo,fecha){
  const f=S.facturas.find(x=>x.num===numF);
  if(!f||f.fechaPago)return false;
  f.metodo=metodo;f.fechaPago=fecha||iso(today0());
  const p=presDe(f.pres);
  if(p&&p.tipo==='venta'){ // REGN-010: descontar stock de lo vendido
    for(const l of p.lineas){const pr=prod(l.codigo);if(pr)pr.stock=Math.max(0,pr.stock-l.cant)}
    revisarStock();
  }
  save();return true;
}

// ---------- Inventario (REGN-001, REGN-002) ----------
const ordenAbierta=c=>S.ordenes.find(o=>o.codigo===c&&o.estado!=='recibida');
function revisarStock(){
  const nuevas=[];
  for(const p of S.productos){
    if(p.stock<p.stockMin&&!ordenAbierta(p.codigo)){
      const o={id:'O-'+String(S.seq.ord++).padStart(4,'0'),codigo:p.codigo,fecha:iso(today0()),cant:p.stockMin-p.stock+Math.max(1,Math.ceil(p.stockMin/2)),estado:'pendiente'};
      S.ordenes.unshift(o);nuevas.push(o);
    }
  }
  return nuevas;
}
function avanzarOrden(id){
  const o=S.ordenes.find(x=>x.id===id);if(!o)return;
  if(o.estado==='pendiente')o.estado='enviada';
  else if(o.estado==='enviada'){o.estado='recibida';const p=prod(o.codigo);if(p)p.stock+=o.cant}
  save();
}

// ---------- Importación de catálogos (RQF-003, REGN-003) ----------
const CAMPOS=['codigo','nombre','marca','categoria','ocasion','pagina','precioCatalogo','peso','volumen','stock','stockMin'];
const EJEMPLO_CSV=`codigo;nombre;marca;categoria;ocasion;pagina;precioCatalogo;peso;volumen;stock;stockMin
EF-102B;Freidora eléctrica 7+7 litros EF-102B;Eutron;Calor;no;12;192;16;0.09;4;3
EF-161;Freidora eléctrica 16 litros EF-161;Eutron;Calor;no;14;265;19;0.11;3;2
PL-60;Plancha eléctrica cromada 60 cm;Eutron;Calor;no;33;298;24;0.12;2;1
BM-3;Baño maría 3 cubetas GN 1/3;Eutron;Calor;no;55;128;9;0.06;5;2
TE-30;Termostato EGO 30-110 °C;Eutron;Repuestos;no;120;27;0.3;0.001;12;4
XX-ERR;Producto con error;Eutron;Calor;no;abc;;1;0.01;1;1`;
function parseCatalogo(texto,nombre){
  const filas=[];
  if(/\.xml$/i.test(nombre)||texto.trim().startsWith('<')){
    const doc=new DOMParser().parseFromString(texto,'application/xml');
    if(doc.querySelector('parsererror'))throw new Error('El archivo XML no es válido.');
    for(const n of doc.querySelectorAll('producto')){const o={};for(const c of CAMPOS)o[c]=(n.querySelector(c)?.textContent||'').trim();filas.push(o)}
  }else{
    const ls=texto.split(/\r?\n/).filter(l=>l.trim());
    if(ls.length<2)throw new Error('El archivo CSV está vacío.');
    const sep=ls[0].includes(';')?';':',';
    const cab=ls[0].split(sep).map(s=>s.trim());
    if(!['codigo','nombre','precioCatalogo'].every(c=>cab.includes(c)))throw new Error('Faltan columnas obligatorias (codigo, nombre, precioCatalogo).');
    for(const l of ls.slice(1)){const v=l.split(sep);const o={};cab.forEach((c,i)=>o[c]=(v[i]||'').trim());filas.push(o)}
  }
  if(!filas.length)throw new Error('El archivo no contiene productos.');
  return filas;
}
function importar(filas,proveedor){
  let nuevos=0,act=0;const errores=[];
  for(const f of filas){
    const pc=parseFloat(String(f.precioCatalogo).replace(',','.')),pg=parseInt(f.pagina,10);
    if(!f.codigo||!f.nombre||!(pc>0)||!(pg>0)){errores.push(f.codigo||'(sin código)');continue}
    const num=k=>{const x=parseFloat(String(f[k]||'').replace(',','.'));return isNaN(x)?0:x};
    const datos={nombre:f.nombre,marca:f.marca||proveedor,categoria:CATS.includes(f.categoria)?f.categoria:'Calor',ocasion:/^(s|si|sí|true|1)$/i.test(f.ocasion||''),pagina:pg,precioCatalogo:pc,peso:num('peso'),volumen:num('volumen'),proveedor};
    const ex=prod(f.codigo);
    if(ex){Object.assign(ex,datos);if(f.stock!=='')ex.stock=num('stock');if(f.stockMin!=='')ex.stockMin=num('stockMin');act++} // REGN: actualiza por código
    else{S.productos.push({codigo:f.codigo,...datos,img:CATIMG[datos.categoria]||'repuesto',stock:num('stock'),stockMin:num('stockMin'),feats:[]});nuevos++}
  }
  const reg={id:uid(),proveedor,fecha:iso(today0()),formato:filas.formato||'CSV',nuevos,actualizados:act,errores:errores.length,listaErr:errores};
  S.catalogos.unshift(reg);revisarStock();save();
  return reg;
}

// ---------- Validaciones de configuración ----------
function solapeProv(prov,desde,hasta,excl){return S.descProv.some(d=>d.id!==excl&&d.proveedor===prov&&desde<=d.hasta&&hasta>=d.desde)}
function validarFactores(lista){
  const t=[...lista].sort((a,b)=>a.desde-b.desde);
  if(!t.length)return 'La tabla debe tener al menos un tramo.';
  if(t[0].desde>0)return 'Los tramos deben empezar en 0 € para cubrir todos los precios.';
  for(let i=0;i<t.length;i++){
    if(!(t[i].hasta>t[i].desde))return 'En cada tramo, "hasta" debe ser mayor que "desde".';
    if(!(t[i].factor>=1))return 'El factor debe ser mayor o igual que 1.';
    if(i&&t[i].desde!==t[i-1].hasta)return t[i].desde<t[i-1].hasta?'Hay tramos que se solapan.':'Hay precios sin cubrir entre dos tramos.';
  }
  if(t[t.length-1].hasta<999999)return 'El último tramo debe cubrir hasta 999.999 €.';
  return '';
}

  const filas=[['Código',p.codigo],['Marca',p.marca],['Categoría',p.categoria],['Estado',p.ocasion?'De ocasión':'Nuevo'],['Precio de venta',eur(venta(p))+' + IVA'],['Descuento vigente',o?`${o.pct} % · del ${fd(o.inicio)} al ${fd(o.fin)} → ${eur(precioFinal(p))} + IVA`:'—'],['Peso y volumen',`${p.peso} kg · ${p.volumen} m³`],['Stock disponible',p.stock?p.stock+' unidades':'Sin stock (bajo pedido)']];
  return `<div class="crumb"><a data-go="home">Inicio</a> / <a data-act="cat" data-v="${esc(p.categoria)}">${esc(p.categoria)}</a> / ${esc(p.nombre)}</div>
  <div class="ficha"><div class="gal"><div class="main">${art(p.img)}</div><div class="th">${[0,1,2,3].map(i=>`<div class="${i?'':'on'}">${art(p.img)}</div>`).join('')}</div></div>
  <div><div class="br small muted" style="font-weight:700;letter-spacing:.06em">${esc(p.marca.toUpperCase())}</div><h1 style="margin:6px 0 10px">${esc(p.nombre)}</h1>
  <div class="row" style="gap:6px"><span class="tag">${p.ocasion?'De ocasión':'Nuevo'}</span><span class="tag ${p.stock?'g':'r'}">${p.stock?'En stock · '+p.stock+' uds.':'Sin stock'}</span><span class="tag">Código ${esc(p.codigo)}</span></div>
  <div class="price" style="font-size:30px;margin:16px 0 10px">${eur(precioFinal(p))}${o?`<s>${eur(venta(p))}</s>`:''}<small>+ IVA</small></div>
  ${o?`<div class="notice" style="margin-bottom:14px">${ic('tag')}<span><b>Oferta: -${o.pct} %</b> del ${fd(o.inicio)} al ${fd(o.fin)}</span></div>`:''}
  <label class="f">Cantidad</label><div class="row"><input id="qty" type="number" min="1" value="1" style="width:90px"><button class="btn p" data-act="addcart" data-c="${esc(p.codigo)}" data-q="1">Añadir al carrito</button><button class="btn" data-act="cotizarfic" data-c="${esc(p.codigo)}">Cotizar transporte</button></div>
  ${p.feats.length?`<h3 style="margin:22px 0 4px">Características</h3><ul class="feat">${p.feats.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}</div></div>
  <section class="sec"><h2 style="margin-bottom:12px">Datos del producto</h2><div class="tbl"><table class="kv"><thead><tr><th>Dato</th><th>Valor</th></tr></thead><tbody>${filas.map(([a,b])=>`<tr><td>${a}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div></section>
  ${rel.length?`<section class="sec"><h2 style="margin-bottom:12px">Productos relacionados</h2><div class="prods">${rel.map(pcard).join('')}</div></section>`:''}`;
}

// ---------- C-05 Carrito y cotización de transporte ----------

  ${lin.length?lin.map(l=>{const o=ofertaDe(l.p);return `<tr><td><b>${esc(l.p.nombre)}</b><div class="small muted">${esc(l.p.marca)} · ${esc(l.p.codigo)}${o?` · descuento del ${o.pct} % aplicado`:''}</div></td><td><span class="qty"><button data-act="qty" data-c="${esc(l.codigo)}" data-d="-1" aria-label="Menos">−</button><span>${l.cant}</span><button data-act="qty" data-c="${esc(l.codigo)}" data-d="1" aria-label="Más">+</button></span></td><td class="n">${eur(precioFinal(l.p))}</td><td class="n">${eur(precioFinal(l.p)*l.cant)}</td><td><button class="ib r" data-act="delcart" data-c="${esc(l.codigo)}" aria-label="Quitar">${ic('trash')}</button></td></tr>`}).join(''):`<tr><td colspan="5" class="empty">Su carrito está vacío. <button class="btn g" data-go="catalogo">Ir al catálogo</button></td></tr>`}</tbody></table></div>
  <form class="card pad" data-form="envio" novalidate><div class="row"><h2>Datos de envío</h2><span class="sp"></span><button type="button" class="btn g sm" data-act="misdatos">Usar los datos de mi cuenta</button></div>
  <div class="f2" style="margin-top:12px"><div><label class="f" for="en">Nombre / razón social</label><input id="en" name="nombre" value="${esc(env.nombre)}" required></div><div><label class="f" for="ex">NIF</label><input id="ex" name="nif" value="${esc(env.nif)}"></div></div>
  <div style="margin-top:12px"><label class="f" for="ed">Dirección de entrega</label><input id="ed" name="dir" value="${esc(env.dir)}" required></div>
  <div class="f3" style="margin-top:12px"><div><label class="f" for="ec">Código postal</label><input id="ec" name="cp" value="${esc(env.cp)}" required inputmode="numeric"></div><div><label class="f" for="ep">Población</label><input id="ep" name="pob" value="${esc(env.pob)}" required></div><div><label class="f" for="ev">Provincia</label><input id="ev" name="prov" value="${esc(env.prov)}"></div></div>
  <div class="f2" style="margin-top:12px"><div><label class="f" for="et">Teléfono</label><input id="et" name="tel" value="${esc(env.tel)}"></div><div><label class="f" for="em">Email</label><input id="em" name="email" value="${esc(env.email)}"></div></div>
  <div class="err" id="ferr"></div><div class="row" style="margin-top:14px"><button class="btn d" ${lin.length?'':'disabled'}>${ic('calc')}Calcular transporte</button><span class="small muted">Se calcula según destino, peso y volumen.</span></div></form></div>
  <aside class="grid">${q?`<div class="notice">${ic('truck')}<div><b>Transporte cotizado: ${eur(q.precio)}</b><div class="small">${q.tarifa?`${esc(q.tarifa.agencia)} · entrega estimada en ${esc(q.tarifa.plazo)}. Envío de ${q.peso} kg y ${q.vol} m³.`:'El envío supera las tarifas configuradas: el transporte se presupuestará aparte.'} El coste se añade al presupuesto.</div></div></div>`:''}
  <div class="card pad" style="background:#f6f8f9"><h3 style="margin-bottom:10px">Resumen del presupuesto</h3><div class="tot"><span>Subtotal productos (${uds} uds.)</span><b>${eur(sub)}</b></div><div class="tot"><span>Transporte${q&&env.pob?' a '+esc(env.pob)+(env.cp?' ('+esc(env.cp)+')':''):''}</span><b>${q?eur(q.precio):'Sin calcular'}</b></div><div class="tot b"><span>Total</span><span>${eur(sub+(q?q.precio:0))}</span></div><p class="small muted" style="margin:4px 0 14px">Importes sin IVA.</p>

function pedirLogin(msg){return `<div class="card pad" style="max-width:560px;margin:40px auto;text-align:center"><h2>Acceso de clientes</h2><p class="muted">${msg}</p><div class="row" style="justify-content:center"><button class="btn p" data-go="login">Iniciar sesión</button><button class="btn" data-go="login" data-tab="reg">Crear cuenta</button></div></div>`}

// ---------- Área de cliente (C-06, C-07) ----------
function cuenta(body,on){
  if(!me||me.rol!=='cliente')return pedirLogin('Inicie sesión con su cuenta de cliente para ver esta sección.');
  const a=(v,i,t)=>`<a class="${on===v?'on':''}" data-go="${v}">${ic(i)}${t}</a>`;
  return `<div class="crumb"><a data-go="home">Inicio</a> / Mi cuenta</div><div class="acct"><nav class="card side"><div class="who"><b>${esc(me.nombre)}</b><div class="small muted">NIF ${esc(me.nif||'—')}</div></div>${a('datos','user','Mis datos')}${a('presupuestos','doc','Mis presupuestos')}${a('averias','wrench','Mis averías')}${a('facturas','card','Mis facturas')}<a data-act="logout">${ic('out')}Cerrar sesión</a></nav><div class="grid" style="gap:18px;align-content:start">${body}</div></div>`;
}

}
function vPres(){
  const p=presDe(V.p.n);if(!p||p.cliente!==me?.id)return cuenta('<div class="empty">Presupuesto no encontrado.</div>','presupuestos');
  const f=facturaDe(p.num),av=p.averia?S.averias.find(a=>a.id===p.averia):null,sub=r2(p.lineas.reduce((s,l)=>s+l.cant*l.precio,0));
  const pago=f?(f.fechaPago?`<div class="card pad"><h3>Factura ${f.num}</h3><div class="tot"><span>Fecha de emisión</span><b>${fd(f.fecha)}</b></div><div class="tot"><span>Importe</span><b>${eur(totalPres(p))}</b></div><div class="notice" style="margin-top:10px">${ic('check')}<span>Pagada el ${fd(f.fechaPago)} por ${esc(f.metodo)}.</span></div><button class="btn w" style="margin-top:12px" data-act="verfactura" data-n="${f.num}">Ver factura</button></div>`
   :`<form class="card pad" data-form="pagar" data-n="${f.num}" novalidate><h3>${p.tipo==='venta'?'Pagar pedido':'Pagar reparación'}</h3><div class="tot"><span>Factura</span><b>${f.num}</b></div><div class="tot"><span>Fecha de emisión</span><b>${fd(f.fecha)}</b></div><div class="tot b"><span>Importe a pagar</span><span>${eur(totalPres(p))}</span></div>
   <fieldset style="border:0;padding:0;margin:12px 0 0"><legend class="f">Método de pago</legend>${['tarjeta','transferencia','efectivo'].map((m,i)=>`<label class="row" style="gap:8px;margin:6px 0;cursor:pointer"><input type="radio" name="metodo" value="${m}" ${i?'':'checked'} data-act="metodo">${m==='efectivo'?'Efectivo en tienda':m[0].toUpperCase()+m.slice(1)}</label>`).join('')}</fieldset>
   <div id="tarj"><label class="f" style="margin-top:8px" for="tn">Número de tarjeta</label><input id="tn" name="num" inputmode="numeric" placeholder="0000 0000 0000 0000"><div class="f2" style="margin-top:10px"><div><label class="f" for="tc">Caducidad</label><input id="tc" name="cad" placeholder="MM/AA"></div><div><label class="f" for="tv">CVV</label><input id="tv" name="cvv" inputmode="numeric" placeholder="000"></div></div></div>
   <div class="err" id="ferr"></div><button class="btn p w" style="margin-top:14px">Pagar ${eur(totalPres(p))}</button><p class="small muted" style="margin:8px 0 0">Pago simulado: el prototipo no conecta con ninguna pasarela real.</p></form>`):'';
  return cuenta(`<div class="row"><div><h1>Presupuesto ${p.tipo==='venta'?'de compra':'de reparación'} ${p.num}</h1><div class="muted small" style="margin-top:4px">Fecha: ${fd(p.fecha)}${av?` · Avería: ${esc(av.equipo)} (aviso del ${fd(av.fecha)})`:''}</div></div><span class="sp"></span>${tagEstado(p.estado)}</div>
  <div class="split"><div class="grid"><div class="tbl"><table><thead><tr><th>Concepto</th><th class="n">Cantidad</th><th class="n">Precio unitario</th><th class="n">Importe</th></tr></thead><tbody>${p.lineas.length?p.lineas.map(l=>`<tr><td><b>${esc(l.nombre)}</b></td><td class="n">${l.cant}</td><td class="n">${eur(l.precio)}</td><td class="n">${eur(l.cant*l.precio)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">Sin piezas ni productos.</td></tr>'}</tbody></table></div>

  <div class="card pad"><div class="tot"><span>${p.tipo==='venta'?'Subtotal productos':'Subtotal piezas'}</span><b>${eur(sub)}</b></div>${p.tipo!=='venta'?`<div class="tot"><span>Mano de obra</span><b>${eur(p.manoObra)}</b></div>`:''}<div class="tot"><span>Transporte</span><b>${eur(p.transporte)}</b></div><div class="tot b"><span>Total del presupuesto</span><span>${eur(totalPres(p))}</span></div><p class="small muted" style="margin:4px 0 0">Importes sin IVA.</p>
  ${p.estado==='pendiente'?`<div class="row" style="margin-top:14px"><button class="btn p" data-act="resolver" data-n="${p.num}" data-ok="1">Aceptar presupuesto</button><button class="btn" data-act="resolver" data-n="${p.num}" data-ok="0">Rechazar</button></div>`:''}</div></div>
  <aside>${pago||`<div class="card pad small muted">${p.estado==='pendiente'?'Cuando acepte el presupuesto se generará la factura y podrá pagarla aquí.':'Este presupuesto no tiene factura.'}</div>`}</aside></div>`,'presupuestos');

}
function vFacturas(){

  ${a?`<div class="grid"><div class="card pad"><div class="row"><h2>${esc(a.equipo)}</h2><span class="sp"></span><label class="small" for="ae">Estado:</label>${tagEstado(a.estado)}${sig.length?`<select id="ae" data-act="aestado" data-id="${a.id}" style="width:auto"><option value="">Cambiar a…</option>${sig.map(s=>`<option>${s}</option>`).join('')}</select>`:''}</div>

  <div class="card pad"><h2>Presupuestos pendientes de respuesta del cliente</h2><div class="tbl" style="margin-top:12px"><table><thead><tr><th>Número</th><th>Cliente</th><th>Tipo</th><th>Fecha</th><th class="n">Total</th></tr></thead><tbody>${pend.map(p=>`<tr><td><b>${p.num}</b></td><td>${esc(user(p.cliente).nombre)}</td><td>${p.tipo==='venta'?'Compra':'Reparación'}</td><td>${fd(p.fecha)}</td><td class="n">${eur(totalPres(p))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Ninguno.</td></tr>'}</tbody></table></div></div>`;

// E-06 Inventario y reabastecimiento
function vInventario(){
  const q=(V.p.q||'').toLowerCase(),sit=V.p.s||'',bajo=S.productos.filter(p=>p.stock<p.stockMin);
  const l=S.productos.filter(p=>(!q||(p.codigo+' '+p.nombre).toLowerCase().includes(q))&&(!sit||(sit==='bajo'?p.stock<p.stockMin:p.stock>=p.stockMin))).sort((a,b)=>(a.stock-a.stockMin)-(b.stock-b.stockMin));
  return `${bajo.length?`<div class="notice a">${ic('alert')}<div style="flex:1"><b>${bajo.length} producto${bajo.length>1?'s':''} por debajo del stock mínimo</b><div class="small">Se ha creado automáticamente una orden de reabastecimiento pendiente para cada uno.</div></div><a class="btn d sm" href="#ordenes">Ver órdenes</a></div>`:`<div class="notice">${ic('check')}<span>Todos los productos están por encima de su stock mínimo.</span></div>`}
  <div class="row"><h2>Nivel de stock</h2><span class="sp"></span><input data-act="iq" value="${esc(V.p.q||'')}" placeholder="Buscar por código o producto" style="max-width:260px"><select data-act="is" style="width:auto"><option value="">Situación: todas</option><option value="bajo" ${sit==='bajo'?'selected':''}>Bajo mínimo</option><option value="ok" ${sit==='ok'?'selected':''}>Correcto</option></select></div>

  <div class="row" id="ordenes"><h2>Órdenes de reabastecimiento</h2><span class="sp"></span><button class="btn" data-act="nuevaorden">${ic('plus')}Nueva orden</button></div>
  <div class="tbl"><table class="stack"><thead><tr><th>Fecha</th><th>Producto</th><th class="n">Cantidad pedida</th><th>Estado</th><th>Acción</th><th>Acciones</th></tr></thead><tbody>${S.ordenes.map(o=>{const p=prod(o.codigo);return `<tr><td>${fd(o.fecha)}</td><td><b>${esc(o.codigo)}</b> · ${esc(p?.nombre||'')}</td><td class="n">${o.cant}</td><td>${tagEstado(o.estado)}</td><td>${o.estado==='recibida'?'—':`<button class="btn g sm" data-act="avanzar" data-id="${o.id}">${o.estado==='pendiente'?'Marcar como enviada':'Marcar como recibida'}</button>`}</td><td style="white-space:nowrap">${o.estado==='pendiente'?`<button class="ib" data-act="editorden" data-id="${o.id}" aria-label="Modificar">${ic('edit')}</button><button class="ib r" data-act="delorden" data-id="${o.id}" aria-label="Cancelar">${ic('trash')}</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No hay órdenes.</td></tr>'}</tbody></table></div>`;

const fv=f=>Object.fromEntries(new FormData(f).entries());
const ferr=(m,id='ferr')=>{const e=document.getElementById(id);if(e)e.textContent=m;return false};
function confirmar(msg,fn){modal(`<h2>¿Seguro?</h2><p>${esc(msg)}</p><div class="row"><button class="btn d" id="okc">Sí, continuar</button><button class="btn" data-act="cerrar">Cancelar</button></div>`);document.getElementById('okc').onclick=()=>{closeModal();fn()}}
function entrar(u){me=u;save();toast('Sesión iniciada como '+u.nombre+'.');go(u.rol==='cliente'?(V.p.back||'home'):'panel')}
function addCart(c,q){
  if(!me||me.rol!=='cliente'){toast('Inicie sesión como cliente para añadir productos al carrito.');go('login',{back:'carrito'});return false}
  const p=prod(c);if(!p)return false;
  const l=cart().find(x=>x.codigo===c);if(l)l.cant+=q;else cart().push({codigo:c,cant:q});
  save();return true;
}

let FAC=[];
function leerFactores(){const f=document.querySelector('[data-form=factores]');const src=V.p.facd||S.factores;FAC=src.map((x,i)=>({id:x.id,desde:parseFloat(f?.elements['desde'+i]?.value??x.desde),hasta:parseFloat(f?.elements['hasta'+i]?.value??x.hasta),factor:parseFloat(f?.elements['factor'+i]?.value??x.factor)}))}
function keepForm(name){const f=document.querySelector(`[data-form=${name}]`);const d=f?fv(f):{};render();const g=document.querySelector(`[data-form=${name}]`);if(g)for(const[k,v]of Object.entries(d))if(g.elements[k])g.elements[k].value=v}
function lanzarImport(texto,nombre,prov){
  let filas;
  try{filas=parseCatalogo(texto,nombre);filas.formato=/\.xml$/i.test(nombre)?'XML':'CSV'}catch(err){V.p.imp={err:1,msg:err.message};render();return}
  V.p.imp={run:1,pct:0};render();
  // RQNF-006: la importación avanza en segundo plano sin bloquear la página
  const paso=()=>{if(V.v!=='productos'){const r=importar(filas,prov);toast(`Importación de ${prov} terminada: ${r.nuevos} nuevos, ${r.actualizados} actualizados.`);return}
    V.p.imp.pct+=20;const bar=document.querySelector('.prog i');if(bar)bar.style.width=V.p.imp.pct+'%';
    if(V.p.imp.pct<100){setTimeout(paso,260);return}
    const r=importar(filas,prov);
    V.p.imp={msg:`Catálogo de ${prov} (${filas.formato}) importado el ${fd(r.fecha)}: ${r.nuevos} producto${r.nuevos===1?'':'s'} nuevo${r.nuevos===1?'':'s'} y ${r.actualizados} actualizado${r.actualizados===1?'':'s'}, con sus precios y beneficio calculados.${r.errores?` ${r.errores} fila${r.errores>1?'s':''} con errores no importada${r.errores>1?'s':''} (${r.listaErr.join(', ')}).`:''}`};render();};
  setTimeout(paso,260);
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('[data-act]:not([data-go])')){e.preventDefault();const d=g.dataset,p={};for(const k of['c','n','id','f','q','e','tab'])if(d[k]!==undefined&&d[k]!=='')p[k]=d[k];if(p.tab)p.tab=d.tab;if(d.go==='eaverias'&&V.v==='eaverias'&&V.p.draft)p.draft=V.p.draft;go(d.go,p);return}
  const a=e.target.closest('[data-act]');
  if(a&&A[a.dataset.act]&&!['SELECT','INPUT'].includes(a.tagName)){e.preventDefault();A[a.dataset.act](a)}
  else if(a&&a.dataset.act==='metodo')A.metodo(a);
});
const CH={
  orden:e=>{F.orden=e.value;render()},
  pq:e=>{V.p.q=e.value;render()},pcat:e=>{V.p.cat=e.value;render()},pmar:e=>{V.p.mar=e.value;render()},
  fq:e=>{V.p.q=e.value;delete V.p.n;render()},fe:e=>{V.p.e=e.value;delete V.p.n;render()},
  iq:e=>{V.p.q=e.value;render()},is:e=>{V.p.s=e.value;render()},
  afil:e=>{go('eaverias',{f:e.value})},
  aestado:e=>{if(!e.value)return;const a=S.averias.find(x=>x.id===e.dataset.id),n=e.value;confirmar(`La avería pasará a «${n}». Este cambio no se puede deshacer.`,()=>{a.estado=n;save();render();toast('Estado actualizado.')});e.value=''},
  oaddp:e=>{if(e.value){V.p.sel=[...(V.p.sel||(V.p.ed?S.ofertas.find(o=>o.id===V.p.ed).productos:[])),e.value];keepForm('oferta')}},
  oaddc:e=>{if(e.value){const s=new Set(V.p.sel||(V.p.ed?S.ofertas.find(o=>o.id===V.p.ed).productos:[]));S.productos.filter(p=>p.categoria===e.value).forEach(p=>s.add(p.codigo));V.p.sel=[...s];keepForm('oferta')}},
  radd:e=>{const p=prod(e.value);if(!p)return;const l=V.p.draft.lineas.find(x=>x.codigo===p.codigo);if(l)l.cant++;else V.p.draft.lineas.push({codigo:p.codigo,nombre:p.nombre,cant:1,precio:precioFinal(p)});render()},
};
document.addEventListener('change',e=>{const a=e.target.closest('[data-act]');if(a&&CH[a.dataset.act])CH[a.dataset.act](a)});
document.addEventListener('input',e=>{const a=e.target;if(a.dataset.act==='rmo'||a.dataset.act==='rtr'){V.p.draft[a.dataset.act==='rmo'?'mo':'tr']=a.value;const d=V.p.draft,sub=r2(d.lineas.reduce((s,l)=>s+l.cant*l.precio,0));document.getElementById('rtot').textContent=eur(sub+(+d.mo||0)+(+d.tr||0))}});

// ---------- Formularios ----------
const FORMS={
  buscar:f=>{F.q=fv(f).q.trim();F.cats=[];go('catalogo')},
  filtros:f=>{const d=new FormData(f);Object.assign(F,{q:(d.get('q')||'').trim(),cats:d.getAll('cats'),marcas:d.getAll('marcas'),nuevo:d.has('nuevo'),ocasion:d.has('ocasion'),min:d.get('min'),max:d.get('max'),stock:d.has('stock'),dto:d.has('dto')});render()},
  login:f=>{const d=fv(f),u=S.usuarios.find(x=>x.email.toLowerCase()===d.email.trim().toLowerCase());if(!u||u.pass!==d.pass)return ferr('El email o la contraseña no son correctos.');entrar(u)},
  registro:f=>{const d=fv(f);for(const k of['nombre','tel','dir','email','pass'])if(!d[k].trim())return ferr('Rellene los campos obligatorios: nombre, teléfono, dirección, email y contraseña.');
    if(!/^\S+@\S+\.\S+$/.test(d.email))return ferr('El email no tiene un formato válido.');
    if(S.usuarios.some(u=>u.email.toLowerCase()===d.email.trim().toLowerCase()))return ferr('Ya existe una cuenta con ese email.'); // REGN-012
    if(d.pass.length<4)return ferr('La contraseña debe tener al menos 4 caracteres.');
    const u={id:'u'+uid(),rol:'cliente',...d,email:d.email.trim()};S.usuarios.push(u);save();toast('Cuenta creada correctamente.');entrar(u)},
  envio:f=>{const d=fv(f);if(!d.nombre.trim()||!d.dir.trim()||!d.cp.trim()||!d.pob.trim())return ferr('Indique nombre, dirección, código postal y población para calcular el transporte.');V.p.env=d;V.p.cot=cotizar(cart());render()},
  misdatos:f=>{Object.assign(me,fv(f));save();toast('Datos guardados.');render()},
  pagar:f=>{const d=fv(f);if(d.metodo==='tarjeta'&&(d.num.replace(/\s/g,'').length<12||!d.cad||!d.cvv))return ferr('Introduzca los datos de la tarjeta.');pagarFactura(f.dataset.n,d.metodo);toast('Pago registrado. ¡Gracias!');render()},
  averia:f=>{const d=fv(f);if(!d.equipo.trim()||!d.desc.trim())return ferr('Indique el equipo averiado y describa el fallo.');S.averias.unshift({id:'A-'+String(S.seq.av++).padStart(4,'0'),cliente:me.id,fecha:iso(today0()),equipo:d.equipo.trim(),desc:d.desc.trim(),estado:'recibida',pres:null});save();toast('Aviso enviado. El técnico revisará la avería.');render()},
  prod:f=>{const d=fv(f),nuevo=f.dataset.n==='1';const n=k=>parseFloat(d[k]);
    if(nuevo&&!d.codigo.trim())return ferr('Indique el código.');if(nuevo&&prod(d.codigo.trim()))return ferr('Ya existe un producto con ese código.');
    if(!d.nombre.trim()||!(n('precioCatalogo')>0)||!(n('pagina')>0))return ferr('Nombre, página y precio de catálogo son obligatorios.');
    const datos={nombre:d.nombre.trim(),marca:d.marca.trim(),categoria:d.categoria,ocasion:d.ocasion==='1',proveedor:d.proveedor.trim()||d.marca.trim(),pagina:parseInt(d.pagina,10),precioCatalogo:n('precioCatalogo'),peso:n('peso')||0,volumen:n('volumen')||0,stock:parseInt(d.stock,10)||0,stockMin:parseInt(d.stockMin,10)||0};
    if(nuevo)S.productos.push({codigo:d.codigo.trim(),img:CATIMG[datos.categoria]||'repuesto',feats:[],...datos});else Object.assign(prod(f.querySelector('[name=codigo]').value),datos);
    revisarStock();save();closeModal();render();toast(nuevo?'Producto creado.':'Producto actualizado. Precio de venta recalculado.')},
  importar:f=>{const file=f.elements.arch.files[0],prov=f.elements.prov.value;if(!file){V.p.imp={err:1,msg:'Seleccione un archivo CSV o XML, o use el archivo de ejemplo.'};render();return}
    if(!/\.(csv|xml)$/i.test(file.name)){V.p.imp={err:1,msg:'Formato no admitido: solo se pueden importar catálogos CSV o XML.'};render();return}
    file.text().then(t=>lanzarImport(t,file.name,prov))},
  oferta:f=>{const d=fv(f),sel=V.p.sel||(V.p.ed?S.ofertas.find(o=>o.id===V.p.ed).productos:[]),pct=parseFloat(d.pct);
    if(!(pct>0&&pct<=90))return ferr('Indique un porcentaje entre 1 y 90.');if(!d.inicio||!d.fin)return ferr('Indique las fechas de inicio y fin.');
    if(d.inicio>=d.fin)return ferr('La fecha de inicio debe ser anterior a la de fin.'); // REGN-005
    if(!sel.length)return ferr('Añada al menos un producto.');
    const choque=S.ofertas.filter(o=>o.id!==V.p.ed&&d.inicio<=o.fin&&d.fin>=o.inicio).flatMap(o=>o.productos.filter(c=>sel.includes(c)));
    if(choque.length)return ferr('Estos productos ya tienen otra oferta en esas fechas: '+[...new Set(choque)].join(', ')+'.');
    if(V.p.ed)Object.assign(S.ofertas.find(o=>o.id===V.p.ed),{pct,inicio:d.inicio,fin:d.fin,productos:sel});else S.ofertas.unshift({id:uid(),pct,inicio:d.inicio,fin:d.fin,productos:sel});
    save();go('descuentos');toast('Descuento guardado.')},
  descprov:f=>{const d=fv(f),a=parseInt(d.desde,10),b=parseInt(d.hasta,10),pct=parseFloat(d.pct);
    if(!(a>0&&b>=a))return ferr('Indique un rango de páginas válido.');if(!(pct>=0&&pct<=90))return ferr('Indique un descuento entre 0 y 90 %.');
    if(solapeProv(d.proveedor,a,b))return ferr('El rango se solapa con otro descuento de '+d.proveedor+'.'); // REGN-003
    S.descProv.push({id:uid(),proveedor:d.proveedor,desde:a,hasta:b,pct});save();render();toast('Descuento añadido. Precios recalculados.')},
  dpedit:f=>{const d=fv(f),x=S.descProv.find(y=>y.id===f.dataset.id),a=parseInt(d.desde,10),b=parseInt(d.hasta,10),pct=parseFloat(d.pct);
    if(!(a>0&&b>=a))return ferr('Indique un rango de páginas válido.');if(!(pct>=0&&pct<=90))return ferr('Indique un descuento entre 0 y 90 %.');
    if(solapeProv(x.proveedor,a,b,x.id))return ferr('El rango se solapa con otro descuento del mismo proveedor.');
    Object.assign(x,{desde:a,hasta:b,pct});save();closeModal();render();toast('Descuento modificado. Precios recalculados.')},
  factores:f=>{leerFactores();const m=validarFactores(FAC);if(m)return ferr(m,'ferr2');S.factores=[...FAC].sort((a,b)=>a.desde-b.desde);delete V.p.facd;save();render();toast('Tabla guardada. Precios de venta recalculados.')},
  tarifa:f=>{const d=fv(f),t={agencia:d.agencia.trim(),pesoMax:parseFloat(d.pesoMax),volMax:parseFloat(d.volMax),precio:parseFloat(d.precio),plazo:d.plazo.trim()||'—'};
    if(!t.agencia||!(t.pesoMax>0)||!(t.volMax>0)||!(t.precio>=0))return ferr('Indique agencia, peso máximo, volumen máximo y precio.');
    if(V.p.ed)Object.assign(S.tarifas.find(x=>x.id===V.p.ed),t);else S.tarifas.push({id:uid(),...t});save();go('tarifas');toast('Tarifa guardada.')},
  presrep:f=>{const d=V.p.draft,a=S.averias.find(x=>x.id===d.av);
    if(a.estado!=='recibida'||a.pres)return ferr('Solo se puede presupuestar una avería recibida y sin presupuesto.'); // REGN-011
    if(!d.lineas.length&&!(+d.mo>0))return ferr('Añada al menos un repuesto o el coste de mano de obra.');
    const p={num:nextNum('pres','P'),tipo:'reparación',cliente:a.cliente,fecha:iso(today0()),estado:'pendiente',averia:a.id,lineas:d.lineas,transporte:+d.tr||0,manoObra:+d.mo||0,envio:null};
    S.presupuestos.unshift(p);a.pres=p.num;delete V.p.draft;save();render();toast('Presupuesto '+p.num+' enviado al cliente.')},
  regpago:f=>{const d=fv(f);confirmar('Se registrará el pago de la factura '+f.dataset.n+'. Las facturas pagadas no se pueden modificar.',()=>{pagarFactura(f.dataset.n,d.metodo,d.fecha);render();toast('Pago registrado.')})},
  ajuste:f=>{const d=fv(f),p=prod(f.dataset.c);p.stock=Math.max(0,parseInt(d.stock,10)||0);p.stockMin=Math.max(0,parseInt(d.stockMin,10)||0);const n=revisarStock();save();closeModal();render();toast(n.length?'Stock ajustado. Orden de reabastecimiento '+n[0].id+' creada automáticamente.':'Stock ajustado.')},
  orden:f=>{const d=fv(f),c=parseInt(d.cant,10);if(!(c>0))return ferr('Indique una cantidad mayor que 0.');
    if(f.dataset.id){S.ordenes.find(o=>o.id===f.dataset.id).cant=c}else{if(ordenAbierta(d.codigo))return ferr('Ese producto ya tiene una orden abierta.');S.ordenes.unshift({id:'O-'+String(S.seq.ord++).padStart(4,'0'),codigo:d.codigo,fecha:iso(today0()),cant:c,estado:'pendiente'})}
    save();closeModal();render();toast('Orden guardada.')},
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// Filtros del catálogo: se aplican al instante (casillas, precios y búsqueda)
function aplicarFiltrosVivo(f,foco){
  FORMS.filtros(f);
  if(foco){const el=document.querySelector('[data-form=filtros] [name="'+foco.name+'"]');if(el){el.focus();try{el.setSelectionRange(foco.pos,foco.pos)}catch(e){}}}
}
let _ft;
document.addEventListener('change',e=>{const f=e.target.closest('form[data-form=filtros]');if(f&&e.target.type!=='text')aplicarFiltrosVivo(f,e.target.type==='number'?null:null)});
document.addEventListener('input',e=>{const f=e.target.closest('form[data-form=filtros]');if(!f)return;const t=e.target;if(!(t.type==='text'||t.type==='number'))return;clearTimeout(_ft);_ft=setTimeout(()=>aplicarFiltrosVivo(f,{name:t.name,pos:t.selectionStart??t.value.length}),350)});

// ---------- Arranque ----------
if(!S.ordenes.some(o=>o.estado==='pendiente'))revisarStock();
save();
go(me?(me.rol==='cliente'?'home':'panel'):'home');
}
</script>
